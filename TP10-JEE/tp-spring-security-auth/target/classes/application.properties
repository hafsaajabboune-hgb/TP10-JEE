# FR: Configuration du serveur HTTP
# EN: HTTP server configuration
server.port=9090
server.servlet.context-path=/
server.error.whitelabel.enabled=false

# FR: Identification de l'application
# EN: Application identification
spring.application.name=secure-authentication-system

# FR: Configuration du moteur de templates Thymeleaf
# EN: Thymeleaf template engine configuration
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true

# FR: Configuration de la gestion des sessions
# EN: Session management configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie

# FR: Niveaux de journalisation pour le d�veloppement - ACTIVER DEBUG
# EN: Logging levels for development - ENABLE DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.security=DEBUG
logging.level.org.springframework.security.web.authentication=DEBUG
logging.level.org.springframework.security.authentication=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n